# Release profile: thin LTO + strip for smaller binaries.
# Opt-level "z" is not used here because it can regress scroll/resize
# performance on large Grid/ListCtrl widgets.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
