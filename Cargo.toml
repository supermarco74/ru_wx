[package]
name = "ru_wx"
version = "0.6.4"
edition = "2021"
description = "Pure Rust cross-platform GUI library with a wxWidgets-like API and native widgets. No C++ bindings."
authors = ["Marco Muratore <supermarco74@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/supermarco74/ru_wx"
homepage = "https://ru_wx.easytaskflow.app/"
documentation = "https://ru_wx.easytaskflow.app/"
readme = "README.md"
keywords = ["gui", "win32", "wxwidgets", "windows", "native"]
categories = ["gui"]
exclude = [
    "/dist/",
    "/examples/examples_win32/",
    "/examples/minitest_win32/",
    "**/*.exe",
    "**/*.pdb",
    "**/*.err",
    "/tools/",
    "/scripts/",
    "/vecchie_elaborazioni/",
]

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg", "gif"] }
resvg = "0.44"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[build-dependencies]
embed-resource = "2.4"
resvg = "0.44"
ico = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Networking_WinHttp",
    "Win32_Security_Credentials",
    "Win32_Media_Multimedia",
    "Win32_Graphics_OpenGL",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }

[[example]]
name = "window_with_button"
path = "examples/window_with_button.rs"

[[example]]
name = "input_controls_demo"
path = "examples/input_controls_demo.rs"

