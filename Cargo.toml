[package]
name = "ru_wx"
version = "0.6.4"
edition = "2021"
description = "A pure Rust cross-platform GUI library with native widgets"

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg", "gif"] }
resvg = "0.44"

[build-dependencies]
embed-resource = "2.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_Media_Multimedia",
    "Win32_Graphics_OpenGL",
    "Win32_Graphics_Dwm",
] }

[[example]]
name = "window_with_button"
path = "examples/window_with_button.rs"

[[example]]
name = "input_controls_demo"
path = "examples/input_controls_demo.rs"

[[example]]
name = "icon_tray_demo"
path = "examples/icon_tray_demo.rs"

[[example]]
name = "grid_demo"
path = "examples/grid_demo.rs"

[[example]]
name = "showcase_all"
path = "examples/showcase_all.rs"

[[example]]
name = "aui_toolbar_demo"
path = "examples/aui_toolbar_demo.rs"

[[example]]
name = "esempio2"
path = "examples/esempio2.rs"

