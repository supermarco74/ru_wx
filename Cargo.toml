[package]
name = "ru_wx"
version = "0.7.2"
edition = "2021"
description = "Cross-platform GUI library with native API calls per platform (Win32, AppKit, GTK4). No intermediate bindings or C++ dependencies."
authors = ["Marco Muratore <supermarco74@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/supermarco74/ru_wx"
homepage = "https://ru_wx.easytaskflow.app/"
documentation = "https://ru_wx.easytaskflow.app/"
readme = "README.md"
keywords = ["gui", "gui-cross-platform", "wxwidgets", "windows", "macos", "linux", "win32", "appkit", "gtk4", "native"]
categories = ["gui", "gui::gtk", "os::windows-apis", "os::macos-apis"]
rust-version = "1.87"
exclude = [
    "/dist/",
    "/release/",
    "/examples/examples_win32/",
    "/examples/minitest_win32/",
    "/examples/examples_macos/",
    "/examples/minitest_macos/",
    "**/*.exe",
    "**/*.pdb",
    "**/*.err",
    "/tools/",
    "/scripts/",
    "/vecchie_elaborazioni/",
]

[dependencies]
human-panic = "2.0"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg", "gif"] }
resvg = "0.44"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
once_cell = "1.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Layer data (opzionale): driver DB dietro feature flag, mai in build base
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
mysql = { version = "28", optional = true }
# Windows backend: win32 (windows_sys) per API classiche, winui3 per UI moderne
# macOS backend: appkit (objc2) per chiamate native AppKit
# Linux backend: gtk4 (gtk-rs) per chiamate native GTK4

[build-dependencies]
embed-resource = "2.4"
resvg = "0.44"
ico = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# v4_10: PopoverMenuBar (menu bar a popup) è gated dietro questa feature
# nell'sdk gtk-rs (nessuna feature è attiva di default).
gtk4 = { version = "0.11", features = ["v4_10"] }
# X11: accesso a XID/Display della superficie GTK, usato dall'inspector
# per posizione finestra e screenshot (XGetImage).
gdk4-x11 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSThread", "NSRunLoop", "NSNotification", "NSObject", "NSIndexSet", "NSTimer", "NSDictionary", "NSArray", "NSSortDescriptor", "NSURL", "NSDate", "NSDateFormatter", "NSBundle"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSButton",
    "NSPopUpButton",
    "NSComboBox",
    "NSScrollView",
    "NSTabView",
    "NSTabViewItem",
    "NSSlider",
    "NSProgressIndicator",
    "NSLevelIndicator",
    "NSStepper",
    "NSAlert",
    "NSTextField",
    "NSSecureTextField",
    "NSCell",
    "NSParagraphStyle",
    "NSSearchField",
    "NSControl",
    "NSResponder",
    "NSRunningApplication",
    "NSMenu",
    "NSMenuItem",
    "NSColor",
    "NSColorSpace",
    "NSColorWell",
    "NSFont",
    "NSFontManager",
    "NSFontPanel",
    "NSPasteboard",
    "NSAttributedString",
    "NSStringDrawing",
    "NSEvent",
    "NSScreen",
    "NSTableView",
    "NSOutlineView",
    "NSTableColumn",
    "NSTableCellView",
    "NSTableHeaderView",
    "NSClipView",
    "NSView",
    "NSUserInterfaceItemIdentification",
    "NSSplitView",
    "NSDragging",
    "NSDraggingSession",
    "NSOpenPanel",
    "NSSavePanel",
    "NSColorPanel",
    "NSPanel",
    "NSScroller",
    "NSText",
    "NSTextView",
    "NSOpenGLView",
    "NSBox",
    "NSDatePicker",
    "NSWorkspace",
    "NSStatusBar",
    "NSStatusItem",
    "NSToolbar",
    "NSToolbarItem",
    "NSVisualEffectView",
    "NSTrackingArea",
    "NSGraphics",
    "NSBezierPath",
    "objc2-quartz-core",
    "NSPrintPanel",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSPageLayout",
    "objc2-core-foundation",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView",
    "WKWebViewConfiguration",
    "WKNavigationDelegate",
    "WKNavigation",
    "WKNavigationAction",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3" }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGContext",
    "CGColorSpace",
    "CGBitmapContext",
    "CGColor",
    "CGImage",
    "CGGeometry",
] }
objc2-core-media = { version = "0.3", features = ["CMTime"] }
objc2-av-foundation = { version = "0.3", features = ["AVPlayer", "AVPlayerItem", "AVAsset", "block2", "objc2-core-media"] }
objc2-av-kit = { version = "0.3", features = ["AVPlayerView"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationResponse", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Core: for WinRT/WinUI3 native bindings
# This provides windows_core::link!, Interface, HSTRING, etc.
windows-core = { version = "0.62.2", default-features = false }
# Windows App SDK bootstrap per framework-dependent deployment
# Usato per MddBootstrapInitialize2 e API di versioning
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Networking_WinHttp",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Media_Multimedia",
    "Win32_Media_Audio",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_OpenGL",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_ApplicationInstallationAndServicing",
] }

# Features for backend selection on Windows
[features]
# Use the WinUI3 backend.
#
# Default is Win32. The WinUI3 backend lives under
# `crate::platform::winui3` and provides:
#   * its own App / Frame / Button / StaticText / TextCtrl / CheckBox /
#     RadioButton / Panel / Choice / ListBox / ListView / Slider /
#     Gauge / ComboBox / RadioBox / StatusBar / Tab / Menu types;
#   * a callback dispatch layer (events.rs) with closure-based
#     handlers wired through WM_COMMAND, WM_NOTIFY, WM_HSCROLL,
#     WM_TIMER, WM_CLOSE;
#   * new widgets: TreeCtrl, Splitter, StaticBox, StaticLine,
#     Hyperlink, SearchCtrl, ProgressBar, SpinCtrl, BitmapButton,
#     ToolBar;
#   * helpers: Timer, AcceleratorTable, dialogs (message box / file /
#     color picker), per-monitor V2 DPI helpers, SVG -> HICON,
#     IconTray.
#
# Reach for it explicitly via
#   use ru_wx::platform::winui3::*;
# (or `ru_wx::platform::default_api::*`) when you want to exercise
# it.
#
# The crate root (`ru_wx::Button`, `ru_wx::Frame`) always resolves to
# the production-quality Win32 implementation; the WinUI3 modules are
# parallel types. Do NOT enable this feature and then write
# `use ru_wx::Button`, because the two `Button` types are distinct.
#
# Note: the WinUI3 backend currently re-uses the Win32 controls via
# `CreateWindowExW` (i.e., it is a "modern Rust-idiomatic surface on
# top of Win32 controls"). A real WinRT / XAML Islands binding is
# not present in the Rust ecosystem yet; once it is, the existing
# widget surface here will be a drop-in transition path.
winui3 = []

# Debug inspector: abilita il modulo `debug` anche nelle build non-debug.
# In debug (`debug_assertions`) è attivo automaticamente.
inspector = []

# WinUI3_Xaml: backend nativo WinRT/XAML (Microsoft.UI.Xaml) via
# windows-reactor. Richiede Windows App SDK per MddBootstrapInitialize2.
#
# Le quattro crate windows-rs-* non sono dichiarate in questo manifest
# perché sono path dependency verso il repository fratello
# windows-rs-study e Cargo le risolve anche se sono `optional`: dichiararle
# romperebbe `cargo build` sui cloni freschi. La feature resta quindi
# vuota, così i `#[cfg(feature = "winui3_xaml")]` nel codice restano
# validi e gli esempi che la richiedono vengono saltati. Per compilare
# il backend, clona windows-rs-study e ripristina le quattro voci
# sotto [target.'cfg(target_os = "windows")'.dependencies].
winui3_xaml = []

# WinUI3_Reactor: component model Fluent UI su windows-reactor.
# Stessa nota di winui3_xaml.
winui3_reactor = []

# Layer data: provider DB multi-backend (SQLite / MySQL / MariaDB).
# Disabilitato di default; abilitare con `--features data-sqlite`,
# `data-mysql` o entrambe (`data-db`).
data-sqlite = ["dep:rusqlite"]
data-mysql = ["dep:mysql"]
data-db = ["data-sqlite", "data-mysql"]

# ─────────────────────────────────────────────────────────────────────
# Le quattro crate windows-rs-* (reactor / numerics / collections /
# future) NON sono dichiarate in questo manifest perché sono path
# dependency verso il repository fratello windows-rs-study, in
# ../windows-rs-study/crates/libs/*. Cargo le risolve anche quando sono
# `optional`, quindi la loro presenza romperebbe `cargo build` per chi
# clona questo crate senza quel checkout.
# I sorgenti dei due backend restano in src/platform/winui3_xaml/:
# per compilarli, clona windows-rs-study e aggiungi qui
#
#   [target.'cfg(target_os = "windows")'.dependencies.windows-reactor]
#   version = "0.0.0"; optional = true
#   path = "../windows-rs-study/crates/libs/reactor"
#
# (e analogamente numerics / collections / future).
# ─────────────────────────────────────────────────────────────────────

